<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Student Login | Navjeevan Education Society</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/student-login.css">
</head>

<body>

    <!-- HEADER -->
    <special-header></special-header>

    <!-- LOGIN PAGE -->
    <section class="login-page">

        <div class="login-container animate">

            <!-- LEFT INFO -->
            <div class="login-info">
                <h2>Student Login</h2>
                <p>
                    Welcome to the Student Portal of  
                    <strong>Navjeevan Education Society’s Polytechnic & College of Engineering</strong>.
                </p>

                <ul>
                    <li>View examination results</li>
                    <li>Check notices & announcements</li>
                    <li>Access academic information</li>
                </ul>
            </div>

            <!-- RIGHT FORM -->
            <div class="login-card">
                <h3>Login to Your Account</h3>

                <form onsubmit="loginStudent(event)">

                    <div class="form-group">
                        <label>Enrollment / PRN Number</label>
                        <input type="text" placeholder="Enter Enrollment / PRN" required>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <div class="password-box">
                            <input type="password" id="password" placeholder="Enter Password" required>
                            <span class="toggle-password" onclick="togglePassword()">👁</span>
                        </div>
                    </div>

                    <button type="submit" class="login-btn">Login</button>

                    <div class="login-links">
                        <a href="#">Forgot Password?</a>
                        <a href="Student Registration.html">New Student? Register</a>
                    </div>
                </form>
            </div>

        </div>
    </section>

    <!-- FOOTER -->
    <special-footer></special-footer>

    <!-- JS -->
    <script src="js/hf.js"></script>
    <script src="js/student-login.js"></script>

</body>
</html>
