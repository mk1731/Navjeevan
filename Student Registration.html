<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Student Registration | Navjeevan Education Society</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/student-registration.css">
</head>

<body>

    <!-- HEADER -->
    <special-header></special-header>

    <!-- REGISTRATION -->
    <section class="register-page">
        <div class="register-container animate">

            <h2>Student Registration</h2>
            <p>Create your student portal account</p>

            <form onsubmit="registerStudent(event)">

                <div class="form-row">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" required placeholder="Enter full name">
                    </div>

                    <div class="form-group">
                        <label>Enrollment / PRN Number</label>
                        <input type="text" required placeholder="Enter Enrollment / PRN">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" required placeholder="Enter email">
                    </div>

                    <div class="form-group">
                        <label>Mobile Number</label>
                        <input type="tel" required placeholder="Enter mobile number">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Program</label>
                        <select required>
                            <option value="">Select Program</option>
                            <option>Diploma</option>
                            <option>B.Tech</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Branch</label>
                        <select required>
                            <option value="">Select Branch</option>
                            <option>Computer Engineering</option>
                            <option>Information Technology</option>
                            <option>Electronics & Telecommunication</option>
                            <option>Electrical Engineering</option>
                            <option>Mechanical Engineering</option>
                            <option>Artificial Intelligence & Data Science</option>
                            <option>Computer Science & Engineering</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="password" required placeholder="Create password">
                    </div>

                    <div class="form-group">
                        <label>Confirm Password</label>
                        <input type="password" id="confirmPassword" required placeholder="Confirm password">
                    </div>
                </div>

                <button type="submit" class="register-btn">Register</button>

                <div class="register-links">
                    <a href="Student Login.html">Already registered? Login</a>
                </div>

            </form>

        </div>
    </section>

    <!-- FOOTER -->
    <special-footer></special-footer>

    <!-- JS -->
    <script src="js/hf.js"></script>
    <script src="js/student-registration.js"></script>

</body>
</html>
